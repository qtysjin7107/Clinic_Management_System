<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Patient | MediCare Clinic</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><div class="app-shell">{% set active_page='patients' %}{% include "_sidebar.html" %}<main class="main-content"><div class="theme-picker" role="group" aria-label="Choose appearance">
<button type="button" class="theme-button" data-theme-choice="light" aria-label="Light theme" title="Light theme" aria-pressed="true">☀</button>
<button type="button" class="theme-button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false">☾</button>
<button type="button" class="theme-button" data-theme-choice="ocean" aria-label="Ocean theme" title="Ocean theme" aria-pressed="false">◉</button>
</div>{% include "_flash.html" %}<header class="topbar"><div class="page-heading"><h1>Edit patient</h1><p>Update patient record #{{ patient[0] }}.</p></div><a class="btn btn-secondary" href="{{ url_for('patients') }}">← Back to patients</a></header><section class="panel"><div class="panel-header"><div><h2>Patient details</h2><p>Save changes when finished.</p></div></div><form method="POST" action="{{ url_for('edit_patient',patient_id=patient[0]) }}"><div class="form-grid"><div class="field"><label for="full_name">Full name *</label><input id="full_name" name="full_name" maxlength="100" value="{{ patient[1] }}" required></div><div class="field"><label for="date_of_birth">Date of birth</label><input id="date_of_birth" name="date_of_birth" type="date" value="{{ patient[2].strftime('%Y-%m-%d') if patient[2] else '' }}"></div><div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select gender</option>{% for value in ['Male','Female','Other'] %}<option value="{{ value }}" {% if patient[3]==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="20" value="{{ patient[4] or '' }}"></div><div class="field"><label for="address">Address</label><textarea id="address" name="address" maxlength="250" rows="3">{{ patient[5] or '' }}</textarea></div></div><button class="btn btn-primary" type="submit">Save changes</button> <a class="btn btn-secondary" href="{{ url_for('patients') }}">Cancel</a></form></section></main></div>{% include "_effects.html" %}</body></html>
