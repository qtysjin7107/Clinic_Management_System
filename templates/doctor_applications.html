<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Applications | MediCare Clinic"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="app-shell">{% set active_page='doctor_applications' %}{% include "_sidebar.html" %}<main class="main-content">
<div class="theme-picker" role="group" aria-label="Choose appearance"><button type="button" class="theme-button" data-theme-choice="light" aria-label="Light theme">☀</button><button type="button" class="theme-button" data-theme-choice="dark" aria-label="Dark theme">☾</button><button type="button" class="theme-button" data-theme-choice="ocean" aria-label="Ocean theme">◉</button></div>
{% include "_flash.html" %}<header class="topbar"><div class="page-heading"><h1>Doctor applications</h1><p>Review public applications before adding doctors to the directory.</p></div><div class="user-avatar">⚕</div></header>
<section class="panel"><div class="panel-header"><div><h2>Submitted applications</h2><p>Approving an application adds the doctor to the active directory. Only administrators can review applications.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Applicant</th><th>Specialization</th><th>Contact</th><th>Proposed fee</th><th>Submitted</th><th>Status</th><th>Actions</th></tr></thead><tbody>
{% for item in applications %}<tr><td><strong>{{ item[1] }}</strong></td><td>{{ item[2] }}</td><td>{{ item[3] or '—' }}<br><small>{{ item[4] or '' }}</small></td><td>{{ '%.2f'|format(item[5]) if item[5] is not none else 'Not provided' }}</td><td>{{ item[7].strftime('%d %b %Y %H:%M') if item[7] else '—' }}</td><td><span class="status-badge {{ 'status-booked' if item[6]=='APPROVED' else ('status-cancelled' if item[6]=='REJECTED' else 'status-pending') }}">{{ item[6] }}</span></td><td>{% if item[6]=='PENDING' %}<div class="actions"><form method="POST" action="{{ url_for('review_doctor_application', application_id=item[0], decision='approve') }}" onsubmit="return confirm('Approve this doctor application and add the doctor to the directory?');"><button class="btn btn-primary" type="submit">Approve</button></form><form method="POST" action="{{ url_for('review_doctor_application', application_id=item[0], decision='reject') }}" onsubmit="return confirm('Reject this doctor application?');"><button class="btn btn-danger" type="submit">Reject</button></form></div>{% else %}—{% endif %}</td></tr>
{% else %}<tr><td colspan="7" class="empty-state">No doctor applications have been submitted yet.</td></tr>{% endfor %}
</tbody></table></div></section></main></div>{% include "_effects.html" %}</body></html>
