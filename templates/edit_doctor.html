
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .page-wrap { max-width: 760px; margin: 35px auto; padding: 0 20px; }
        .panel { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 10px #00000012; }
        .field { margin-bottom: 17px; }
        .field label { display: block; font-weight: 600; margin-bottom: 6px; }
        .field input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { display: inline-block; padding: 10px 15px; border: 0; border-radius: 5px; text-decoration: none; cursor: pointer; }
        .btn-primary { background: #1769aa; color: white; }
        .btn-secondary { background: #e8edf2; color: #222; }
        .flash-message { padding: 12px; margin-bottom: 10px; border-radius: 5px; background: #edf2f7; }
        .flash-message.error, .flash-message.danger { background: #fdeaea; color: #922; }
        .flash-message.success { background: #e7f6eb; color: #185b2c; }
    </style>
</head>
<body>
    <main class="page-wrap">
        <p><a href="{{ url_for('doctors') }}">← Back to Doctor Management</a></p>
        <h1>Edit Doctor</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <section class="panel">
            <form method="POST"
                  action="{{ url_for('edit_doctor', doctor_id=doctor[0]) }}">
                <div class="field">
                    <label for="full_name">Doctor's Full Name *</label>
                    <input id="full_name" name="full_name" maxlength="100"
                           value="{{ doctor[1] }}" required>
                </div>

                <div class="field">
                    <label for="specialization">Specialization *</label>
                    <input id="specialization" name="specialization" maxlength="100"
                           value="{{ doctor[2] }}" required>
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" name="phone" type="tel" maxlength="20"
                           value="{{ doctor[3] or '' }}">
                </div>

                <div class="field">
                    <label for="consultation_fee">Consultation Fee</label>
                    <input id="consultation_fee" name="consultation_fee"
                           type="number" min="0" step="0.01"
                           value="{{ doctor[4] if doctor[4] is not none else '' }}">
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('doctors') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
