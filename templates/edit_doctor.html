<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Doctor | MediCare Clinic</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><div class="app-shell">{% set active_page='doctors' %}{% include "_sidebar.html" %}<main class="main-content"><div class="theme-picker" role="group" aria-label="Choose appearance">
<button type="button" class="theme-button" data-theme-choice="light" aria-label="Light theme" title="Light theme" aria-pressed="true">☀</button>
<button type="button" class="theme-button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false">☾</button>
<button type="button" class="theme-button" data-theme-choice="ocean" aria-label="Ocean theme" title="Ocean theme" aria-pressed="false">◉</button>
</div>{% include "_flash.html" %}<header class="topbar"><div class="page-heading"><h1>Edit doctor</h1><p>Update doctor record #{{ doctor[0] }}.</p></div><a class="btn btn-secondary" href="{{ url_for('doctors') }}">← Back to doctors</a></header><section class="panel"><div class="panel-header"><div><h2>Doctor details</h2><p>Save changes when finished.</p></div></div><form method="POST" action="{{ url_for('edit_doctor',doctor_id=doctor[0]) }}"><div class="form-grid"><div class="field"><label for="full_name">Doctor's full name *</label><input id="full_name" name="full_name" maxlength="100" value="{{ doctor[1] }}" required></div><div class="field"><label for="specialization">Specialization *</label><input id="specialization" name="specialization" maxlength="100" value="{{ doctor[2] }}" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="20" value="{{ doctor[3] or '' }}"></div><div class="field"><label for="consultation_fee">Consultation fee</label><input id="consultation_fee" name="consultation_fee" type="number" min="0" max="99999999.99" step="0.01" value="{{ doctor[4] if doctor[4] is not none else '' }}"></div></div><button class="btn btn-primary" type="submit">Save changes</button> <a class="btn btn-secondary" href="{{ url_for('doctors') }}">Cancel</a></form></section></main></div>{% include "_effects.html" %}</body></html>
